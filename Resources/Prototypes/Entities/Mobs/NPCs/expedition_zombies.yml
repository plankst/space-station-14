# Infected crew that roam salvage expeditions (see the Zombies salvage faction).
# They spawn as random humans in random crew clothing and turn into zombies a moment later.

- type: entity
  parent: MobHuman
  id: MobZombieExpedition
  name: infected crewmember
  suffix: Expedition, Zombie
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: InputMover
  - type: MobMover
  - type: ZombifyOnSpawn
    infectionChance: 0.5
  - type: Loadout
    prototypes:
    - ZombieGearPassenger
    - ZombieGearPassengerBlue
    - ZombieGearEngineer
    - ZombieGearDoctor
    - ZombieGearSurgeon
    - ZombieGearParamedic
    - ZombieGearScientist
    - ZombieGearChemist
    - ZombieGearChef
    - ZombieGearSecurity
    - ZombieGearCargo
    - ZombieGearSalvager
    - ZombieGearJanitor
    - ZombieGearBartender
    - ZombieGearBotanist
    - ZombieGearPrisoner
    - ZombieGearClown
    - ZombieGearMime
    - ZombieGearDetective
    - ZombieGearWinter
    - ZombieGearAncient

# Rarer: someone who died in their space suit.
- type: entity
  parent: MobZombieExpedition
  id: MobZombieExpeditionSuited
  name: infected spacer
  components:
  - type: Loadout
    prototypes:
    - ZombieGearEVA
    - ZombieGearSalvageHardsuit

# Gear sets. No gloves or headsets (zombification drops those on the floor), no IDs, bags or weapons.

